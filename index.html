<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f7f3">
<title>MONOPOLY FIFA WORLD CUP 2026</title>
<style>
:root{
 --bg:#f5f7f3;--paper:#ffffff;--paper2:#fbfcfa;--ink:#111111;--line:#d9ddd7;
 --sage:#657b69;--sage2:#edf3ed;--gold:#c4a25a;--shadow:0 14px 40px rgba(35,46,37,.08);
 --danger:#985c5c;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:linear-gradient(145deg,#fafbf8 0%,#f2f5f0 52%,#f8f7f2 100%);color:var(--ink)}
body,button,input,select,textarea{font-family:"Sukhumvit Set","Thonburi",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{font-weight:400}
button,input,select,textarea{font-size:16px;color:var(--ink)}
button{cursor:pointer}
.hidden{display:none!important}
.app{width:min(1180px,100%);margin:0 auto;padding:12px}
.panel{background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
.hero{max-width:900px;margin:3vh auto;padding:24px}
.logo{margin:0 0 20px;line-height:.98;letter-spacing:-.02em}
.logo .a{display:block;font-size:clamp(40px,8vw,64px);font-weight:600;letter-spacing:.035em}
.logo .b{display:block;font-size:clamp(25px,5.5vw,42px);font-weight:500;margin-top:7px}
.segment{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:5px;border:1px solid var(--line);background:#f0f2ef;border-radius:14px}
.segment button{border:0;background:transparent;border-radius:10px;padding:10px 8px;font-weight:500}
.segment button.on{background:#fff;outline:2px solid #111;outline-offset:-1px}
.profileSetup{display:grid;gap:12px;margin-top:14px}
.profileRow{display:grid;grid-template-columns:1.05fr 1.45fr .9fr;gap:10px}
.box{background:var(--paper2);border:1px solid var(--line);border-radius:15px;padding:11px}
.label{display:block;font-size:12px;font-weight:600;margin-bottom:7px;color:#111}
.box input,.box select,.modal input,.modal select,.modal textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 11px;background:#fff;outline:none}
.box input:focus,.box select:focus,.modal input:focus,.modal select:focus,.modal textarea:focus{border-color:#8c9a8e;box-shadow:0 0 0 3px rgba(101,123,105,.09)}
.avatarChoices{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.avatarOpt{height:50px;border-radius:12px;border:1px solid var(--line);background:#fff;color:#4f6554;display:grid;place-items:center}
.avatarOpt.on{outline:2px solid #111;outline-offset:1px;background:#f5f8f4}
.avatarSvg{width:35px;height:35px;display:block}
.tokenChoices{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.tokenOpt{height:44px;border:1px solid #aeb5af;border-radius:11px;position:relative}
.tokenOpt.on{outline:3px solid #111;outline-offset:2px}
.tokenOpt.used{opacity:.22;pointer-events:none}
.tokenName{font-size:12px;margin-top:7px;color:#111}
.twoCol{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.help{font-size:12px;line-height:1.55;margin:11px 0 0;color:#111}
.rowBtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{border:0;border-radius:13px;padding:12px 17px;background:var(--sage);color:#fff;font-weight:600}
.btn.secondary{background:#fff;color:#111;border:1px solid var(--line)}
.btn.soft{background:var(--sage2);color:#111;border:1px solid var(--line)}
.btn.danger{background:var(--danger)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.topbar .title{font-size:18px;font-weight:600}
.topbar .tools{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;min-height:30px;padding:5px 9px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:12px}
.draftLayout{display:grid;grid-template-columns:290px 1fr;gap:12px}
.sticky{position:sticky;top:10px;height:max-content;padding:15px}
.draftWho{font-size:28px;font-weight:600;margin:5px 0 10px}
.teamMiniLine{display:flex;align-items:center;gap:7px;margin:7px 0;font-size:13px}
.avatarFrame{width:42px;height:42px;border-radius:13px;border:3px solid #bbb;background:#fff;display:grid;place-items:center;color:#4f6554;box-shadow:0 6px 18px rgba(40,50,42,.07)}
.avatarFrame .avatarSvg{width:27px;height:27px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:9px}
.playerCard{border:1px solid var(--line);border-radius:16px;background:#fff;padding:12px;min-height:150px;box-shadow:0 6px 18px rgba(40,50,42,.04)}
.playerCard.pick{cursor:pointer}
.playerCard.pick:active{transform:scale(.99)}
.playerCard .name{font-size:15px;font-weight:600;line-height:1.18}
.playerCard .meta{font-size:11px;margin:5px 0 9px;color:#111}
.hiddenStats{font-size:11px;padding:8px;border-radius:9px;background:#f3f5f2;border:1px solid var(--line)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.stat{border:1px solid var(--line);background:#fafbf9;border-radius:9px;text-align:center;padding:5px 3px;font-size:9px}
.stat b{display:block;font-size:16px;font-weight:600}
.gameLayout{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:12px}
.turnBox{padding:17px}
.turnCaption{font-size:12px;font-weight:600}
.turnName{display:flex;align-items:center;gap:9px;font-size:27px;font-weight:600;margin-top:6px}
.boardNote{margin-top:10px;padding:10px 11px;border:1px solid var(--line);border-radius:12px;background:#f4f6f3;font-size:12px;line-height:1.5}
.actionsGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.action{min-height:108px;border:1px solid var(--line);border-radius:17px;background:#fff;text-align:left;padding:13px;color:#111}
.action:active{transform:scale(.99)}
.action .tag{width:39px;height:29px;border:1px solid #cfd5cf;background:#eef2ed;border-radius:9px;display:grid;place-items:center;font-size:10px;font-weight:600;letter-spacing:.04em}
.action b{display:block;margin-top:8px;font-size:16px;font-weight:600;line-height:1.25}
.action small{display:block;margin-top:3px;font-size:11px;line-height:1.45;color:#111}
.action.goWide{grid-column:1/-1;min-height:118px;background:#eef4ee}
.side{display:grid;gap:10px}
.side .panel{padding:14px}
.sideTitle{font-weight:600}
.scoreList{display:grid;gap:7px;margin-top:8px}
.score{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:13px;background:#fbfcfa;padding:9px}
.score.current{outline:2px solid #111;outline-offset:1px}
.score .pts{font-size:20px;font-weight:600;color:#111}
.small{font-size:11px;line-height:1.45;color:#111}
.teamGrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.miniCard{border:1px solid var(--line);border-radius:11px;background:#fff;padding:8px;min-height:77px;font-size:10px}
.miniCard.off{opacity:.46;filter:grayscale(.6)}
.miniCard b{display:block;font-size:11px;font-weight:600;line-height:1.15}
.powerRow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.powerBtn{padding:7px 8px;border-radius:9px;border:1px solid var(--line);background:#edf2ed;font-size:10px}
.log{font-size:11px;max-height:230px;overflow:auto;margin-top:7px}
.log div{padding:6px 0;border-bottom:1px solid #e5e8e4}
.overlay{position:fixed;inset:0;z-index:2200}
.modalBg{position:absolute;inset:0;background:rgba(25,31,27,.27);backdrop-filter:blur(7px);display:grid;place-items:center;padding:12px}
.modal{width:min(760px,100%);max-height:92vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:21px;padding:18px;box-shadow:0 28px 80px rgba(30,40,33,.18)}
.modal h2{font-size:22px;font-weight:600;margin:0 0 8px}
.modal p{line-height:1.55}
.modalBtns{display:flex;justify-content:flex-end;gap:7px;flex-wrap:wrap;margin-top:14px}
.modalBtns button{border:0;border-radius:10px;padding:9px 12px;background:#e9eeea;color:#111;font-weight:600}
.modalBtns button.primary{background:var(--sage);color:#fff}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:8px;margin-top:10px}
.choice{border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left;padding:10px;color:#111}
.choice b{display:block;font-weight:600;line-height:1.2}
.choice small{display:block;margin-top:4px;font-size:11px;line-height:1.4}
.matchChoice{border-left:8px solid var(--mc)}
.notice{border:1px solid var(--line);border-radius:12px;background:#f3f6f2;padding:10px;margin:8px 0;line-height:1.5}
.pass{position:absolute;inset:0;background:linear-gradient(145deg,#fafbf8,#edf2ed);display:grid;place-items:center;padding:20px;text-align:center}
.passBox{width:min(500px,100%)}
.passAvatar{width:92px;height:92px;border-radius:27px;border:4px solid #bbb;background:#fff;display:grid;place-items:center;margin:0 auto 12px;color:#4f6554}
.passAvatar .avatarSvg{width:55px;height:55px}
.passName{font-size:38px;font-weight:600;line-height:1.05}
.dicePanel{border-radius:16px;padding:14px;border:1px solid var(--line);margin-top:9px}
.dicePanel.white{background:#fff}
.dicePanel.green{background:#edf6ee;border-color:#b9cbbb}
.dicePanel.red{background:#faeeee;border-color:#dfbbbb}
.diceTitle{font-size:16px;font-weight:600}
.diceChoices{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-top:9px}
.dieBtn{min-height:49px;border-radius:11px;border:1px solid #cfd5cf;background:#fff;font-size:17px;font-weight:600}
.dieBtn.on{outline:3px solid #111;outline-offset:1px}
.setGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.setBox{border:1px solid var(--line);border-left:7px solid var(--mc);border-radius:12px;background:#fff;padding:10px}
.table{width:100%;border-collapse:collapse}
.table th,.table td{padding:8px;border-bottom:1px solid #e2e5e1;text-align:left;font-size:12px}
.table th{font-weight:600}.table th:last-child,.table td:last-child{text-align:right}
.globalUndo{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:3000;border:1px solid #cdd3ce;border-radius:999px;background:#fff;color:#111;padding:10px 14px;font-weight:600;box-shadow:0 8px 22px rgba(40,50,42,.12)}
.globalUndo:disabled{opacity:.35}
@media(max-width:980px){.gameLayout{grid-template-columns:1fr}.side{grid-template-columns:1fr 1fr}.logPanel{grid-column:1/-1}}
@media(max-width:700px){
 .app{padding:8px}.hero{padding:19px;margin:1.5vh auto}
 .profileRow{grid-template-columns:1fr}.twoCol{grid-template-columns:1fr}
 .draftLayout{grid-template-columns:1fr}.sticky{position:static}
 .cards{grid-template-columns:1fr 1fr}
 .side{grid-template-columns:1fr}.setGrid{grid-template-columns:1fr}
 .turnName{font-size:24px}.passName{font-size:34px}
}
</style>
</head>
<body>
<div id="app" class="app"></div>
<button id="globalUndo" class="globalUndo hidden"></button>
<div id="overlay" class="overlay hidden"></div>
<script>
"use strict";

 if(type==="jet"){await info(T.teamJet,T.jetHelp);return}

 try{
  let result={cancelled:false,endTurn:true};
  if(type==="historic")result=await doHistoric();

  else if(type==="gamechanger")result=await doGameChanger();

async function doTransfer(){
 const cur=state.current,me=state.players[cur],mine=await chooseAnyPlayer(cur,T.chooseOwnTransfer);if(mine==null)return{cancelled:true};
 const opts=[];
 state.players.forEach((pl,i)=>{if(i!==cur)pl.team.forEach(id=>opts.push({kind:"player",owner:i,id}))});
 state.reserve.forEach(id=>opts.push({kind:"reserve",owner:null,id}));
 const pick=await choose(T.chooseTargetTransfer,opts.map((o,i)=>{const q=byId(o.id);return{value:i,html:`<b>${esc(q.name)}</b><small>${o.kind==="reserve"?T.reserve:esc(state.players[o.owner].name)} &middot; R${q.rating} A${q.attack} D${q.defense} S${q.skills}</small>`}}));
 if(pick==null)return{cancelled:true};
 const o=opts[pick],mineStatus=me.active[mine];
 if(o.kind==="player"){
  const other=state.players[o.owner],targetStatus=other.active[o.id];
  me.team=me.team.map(x=>x===mine?o.id:x);other.team=other.team.map(x=>x===o.id?mine:x);

}
async function doGO(){
 const cur=state.current,pl=state.players[cur];pl.points+=4;pl.team.forEach(id=>pl.active[id]=true);addLog(pl.name+" GO +4");
 await info(T.go,T.goResult);
 if(state.wcPlayed.length>=state.wcNumbers.length){await finishGame();return{endTurn:false}}
 const num=state.wcNumbers[state.wcPlayed.length];
 await info(T.openWC,`${T.expected} <b>${num}</b>`);
 const ok=await doWorldCup(num);if(!ok)return{cancelled:true};
 if(state.wcPlayed.length>=state.wcNumbers.length){await finishGame();return{endTurn:false}}
 return{endTurn:true}
}
async function doWorldCup(num){
 const cur=state.current,op=await chooseOpponent(cur,T.wcChooseOpponent);if(op==null)return false;
 state.players[cur].team.forEach(id=>state.players[cur].active[id]=true);state.players[op].team.forEach(id=>state.players[op].active[id]=true);
 const cfg=await worldCupConfig(num);if(!cfg)return false;
 const mine=[],theirs=[];
 for(let k=0;k<3;k++){const a=await choosePlayer(cur,"World Cup 26 - "+T.round+" "+(k+1),mine);if(a==null)return false;mine.push(a);const b=await choosePlayer(op,"World Cup 26 - "+T.round+" "+(k+1),theirs);if(b==null)return false;theirs.push(b)}
 let aw=0,bw=0;const rows=[];
 for(let k=0;k<3;k++){
  const qa=byId(mine[k]),qb=byId(theirs[k]),sa=cfg.rounds[k][0],sb=cfg.rounds[k][1],va=qa[sa],vb=qb[sb];
  if(va>vb)aw++;else if(vb>va)bw++;
  rows.push(esc(qa.name)+" "+sa+" "+va+" vs "+esc(qb.name)+" "+sb+" "+vb);
 }
 let winner;if(aw>bw)winner=cur;else if(bw>aw)winner=op;else{winner=await whiteTie(cur,op);if(winner==null)return false}
 state.players[cur].team.forEach(id=>state.players[cur].active[id]=true);state.players[op].team.forEach(id=>state.players[op].active[id]=true);
 state.players[winner].wc.push({number:num,value:cfg.value});state.wcPlayed.push(num);
 await info("FIFA World Cup 26 #"+num,rows.join("<br>")+`<div class="notice"><b>${esc(state.players[winner].name)}</b> ${T.wcWinner} &middot; ${T.endValue} ${cfg.value}</div>`);
 addLog(state.players[winner].name+" won WC26 #"+num);return true;
}
function worldCupConfig(num){
 return new Promise(res=>{
  const opts='<option value="rating">Player Rating</option><option value="attack">Attack</option><option value="defense">Defense</option><option value="skills">Skills</option>';
  openOverlay(`<div class="modalBg"><div class="modal"><h2>${T.wcRead} #${num}</h2>${[1,2,3].map(i=>`<div class="twoCol"><div><label class="label">${T.round} ${i} - ${T.currentSide}</label><select id="wa${i}">${opts}</select></div><div><label class="label">${T.round} ${i} - ${T.opponent}</label><select id="wb${i}">${opts}</select></div></div>`).join("")}<label class="label" style="margin-top:10px">${T.wcGameEnd}</label><input id="wcValue" type="number" min="0" value="0"><div class="modalBtns"><button id="wcCancel">${T.cancel}</button><button class="primary" id="wcOk">${T.next}</button></div></div></div>`);
  $("#wcCancel").onclick=()=>{closeOverlay();res(null)};
  $("#wcOk").onclick=()=>{const rounds=[1,2,3].map(i=>[$("#wa"+i).value,$("#wb"+i).value]),value=Math.max(0,+$("#wcValue").value||0);closeOverlay();res({rounds,value})};
 })
}
function askWhiteDie(title,roller){
 return new Promise(res=>{openOverlay(`<div class="modalBg"><div class="modal"><h2>${esc(title)}</h2><div class="dicePanel white"><div class="diceTitle">${esc(roller)}</div><div class="small">${T.chooseRealDie}</div><div class="diceChoices">${[1,2,3,4,5,6].map(v=>`<button class="dieBtn wd" data-v="${v}">${v}</button>`).join("")}</div></div><div class="modalBtns"><button id="whiteCancel">${T.cancel}</button></div></div></div>`);$$(".wd").forEach(b=>b.onclick=()=>{const v=+b.dataset.v;closeOverlay();res(v)});$("#whiteCancel").onclick=()=>{closeOverlay();res(null)}})
}
async function whiteTie(a,b){
 const x=await askWhiteDie(T.whiteTie,state.players[a].name);if(x==null)return null;
 const y=await askWhiteDie(T.whiteTie,state.players[b].name);if(y==null)return null;
 if(x===y){await info(T.tieAgain,x+" - "+y);return whiteTie(a,b)}
 return x>y?a:b;
}
async function multiWhiteTie(indices){
 const results=[];
 for(const i of indices){const r=await askWhiteDie(T.whiteTie,state.players[i].name);if(r==null)return null;results.push({i,r})}
 const max=Math.max(...results.map(x=>x.r)),top=results.filter(x=>x.r===max).map(x=>x.i);
 if(top.length>1){await info(T.tieAgain,String(max));return multiWhiteTie(top)}
 return top[0];
}
async function benchStart(){
 const pi=state.current,pl=state.players[pi],before=JSON.stringify(state);
 const choice=await choose(T.benchTitle,[
  {value:"pay",html:`<b>${T.payOne}</b>`},
  {value:"roll",html:`<b>${T.tryWhite}</b><small>${T.benchAttempts}: ${pl.benchAttempts}/3</small>`}
 ],`<div class="notice">${T.benchAttempts}: ${pl.benchAttempts}/3</div>`);
 if(choice==null){passTo(pi,false);return}
 if(choice==="pay"){
  await ensureFunds(pi,1);pl.points=Math.max(0,pl.points-1);pl.posStatus="board";pl.benchAttempts=0;pushHistory(before);await info(T.outBench,T.rollMove);renderGame();save();return;
 }
 const d=await askWhiteDie(T.tryWhite,pl.name);if(d==null){passTo(pi,false);return}
 if(d===6){pl.posStatus="board";pl.benchAttempts=0;pushHistory(before);await info(T.rolledSix,T.moveSixEnd);await endTurn();return}
 pl.benchAttempts++;
 if(pl.benchAttempts>=3){await ensureFunds(pi,1);pl.points=Math.max(0,pl.points-1);pl.posStatus="board";pl.benchAttempts=0;pushHistory(before);await info(T.thirdFail,T.payMove+" ("+d+")");renderGame();save();return}
 pushHistory(before);await info(T.benchTitle,T.stayBench+" ("+d+")");await endTurn();
}
function openBoardReference(){
 openOverlay(`<div class="modalBg"><div class="modal"><h2>${T.boardTitle}</h2><p>${T.boardHelp}</p><div class="choices">${BOARD.map((x,i)=>`<div class="choice"><b>${i}. ${esc(x)}</b></div>`).join("")}</div><div class="modalBtns"><button class="primary" id="boardClose">${T.close}</button></div></div></div>`);$("#boardClose").onclick=closeOverlay;
}
function openMatchList(){
 openOverlay(`<div class="modalBg"><div class="modal"><h2>${T.matches}</h2><div class="setGrid">${state.historic.slice().sort((a,b)=>a.boardPos-b.boardPos).map(h=>`<div class="setBox" style="--mc:${COLORS[h.color]}"><b>${h.year} ${esc(h.stage)}</b><div class="small">${esc(h.teams)}<br>${T.cost} ${h.cost} &middot; ${T.bonus} ${h.bonus} &middot; ${T.endValue} ${h.end}<br>${T.owner}: ${h.owner==null?T.bank:esc(state.players[h.owner].name)}</div></div>`).join("")}</div><div class="modalBtns"><button class="primary" id="matchClose">${T.close}</button></div></div></div>`);$("#matchClose").onclick=closeOverlay;
}
function openManage(){
 openOverlay(`<div class="modalBg"><div class="modal"><h2>${T.manage}</h2><div class="choices">
 <button class="choice man" data-x="points"><b>${T.managePoints}</b></button>
 <button class="choice man" data-x="active"><b>${T.manageActive}</b></button>
 <button class="choice man" data-x="owner"><b>${T.manageOwner}</b></button>
 <button class="choice man" data-x="final"><b>${T.finalScore}</b></button>
 </div><div class="modalBtns"><button id="manageClose">${T.close}</button></div></div></div>`);
 $$(".man").forEach(b=>b.onclick=async()=>{const x=b.dataset.x;closeOverlay();if(x==="points")await manualPoints();if(x==="active")await manualActive();if(x==="owner")await manualOwner();if(x==="final")await finishGame()});
 $("#manageClose").onclick=closeOverlay;
}
async function manualPoints(){
 const pi=await choose(T.choosePlayer,state.players.map((p,i)=>({value:i,html:`<b>${esc(p.name)}</b><small>${p.points} Points</small>`})));if(pi==null)return;
 const before=JSON.stringify(state);
 return new Promise(res=>{openOverlay(`<div class="modalBg"><div class="modal"><h2>${T.managePoints} - ${esc(state.players[pi].name)}</h2><label class="label">${T.pointChange}</label><input id="deltaPts" type="number" value="0"><div class="modalBtns"><button id="mpCancel">${T.cancel}</button><button class="primary" id="mpOk">${T.save}</button></div></div></div>`);$("#mpCancel").onclick=()=>{closeOverlay();res()};$("#mpOk").onclick=()=>{state.players[pi].points=Math.max(0,state.players[pi].points+(+$("#deltaPts").value||0));closeOverlay();pushHistory(before);renderGame();save();res()}})
}
async function manualActive(){
 const pi=await choose(T.choosePlayer,state.players.map((p,i)=>({value:i,html:`<b>${esc(p.name)}</b>`})));if(pi==null)return;
 const id=await chooseAnyPlayer(pi,T.choosePlayerCard);if(id==null)return;
 const before=JSON.stringify(state);state.players[pi].active[id]=!state.players[pi].active[id];pushHistory(before);renderGame();save();
}
async function manualOwner(){
 const hid=await choose(T.chooseMatch,state.historic.map(h=>({value:h.id,html:`<b>${h.year} ${esc(h.teams)}</b><small>${T.owner}: ${h.owner==null?T.bank:esc(state.players[h.owner].name)}</small>`})));if(hid==null)return;
 const opts=[{value:-1,html:`<b>${T.bank}</b>`}].concat(state.players.map((p,i)=>({value:i,html:`<b>${esc(p.name)}</b>`})));
 const owner=await choose(T.owner,opts);if(owner==null)return;
 const before=JSON.stringify(state);state.historic.find(h=>h.id===hid).owner=owner<0?null:owner;pushHistory(before);renderGame();save();
}
async function finishGame(){
 const rows=state.players.map((pl,i)=>{const hv=state.historic.filter(h=>h.owner===i).reduce((s,h)=>s+h.end*(completeSet(i,h.color)?2:1),0),wv=pl.wc.reduce((s,x)=>s+(x.value||0),0);return{name:pl.name,chips:pl.points,hv,wv,total:pl.points+hv+wv}}).sort((a,b)=>b.total-a.total);
 state.phase="ended";save();
 await new Promise(res=>{openOverlay(`<div class="modalBg"><div class="modal"><h2>${T.finalScore}</h2><table class="table"><tr><th>${T.choosePlayer}</th><th>Chips</th><th>Historic</th><th>WC26</th><th>Total</th></tr>${rows.map(r=>`<tr><td><b>${esc(r.name)}</b></td><td>${r.chips}</td><td>${r.hv}</td><td>${r.wv}</td><td><b>${r.total}</b></td></tr>`).join("")}</table><div class="notice"><b>${esc(rows[0].name)}</b> ${T.finalHighest}${rows.length>1&&rows[0].total===rows[1].total?"<br>"+T.finalTie:""}</div><div class="modalBtns"><button class="primary" id="finalClose">${T.close}</button></div></div></div>`);$("#finalClose").onclick=()=>{closeOverlay();res()}})
}
$("#globalUndo").onclick=undoLast;
renderSetup();
</script>
