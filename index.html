<style>

place-items:center;min-width:29px;height:29px;margin-right:8px;border-radius:8px;border:1px solid #d5dad4;background:#f4f6f3;font-size:10px;font-weight:700}@media(max-width:700px){.boardReferenceModal{max-height:94vh}.boardPreview{min-width:520px}.boardCell{font-size:7.5px}}

.logPanel summary::-webkit-details-marker{display:none}
.logPanel summary:after{content:"+";font-size:16px;font-weight:500}
.logPanel details[open] summary:after{content:"-"}
.logPanel .log{margin-top:8px}
.manualEffectGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.manualEffectGrid .choice{min-height:68px}
.teamJetStay{border:1.5px solid #111!important;background:#f7f8f6!important}

async function liquidateForDebt(pi,amount){

  const owned=state.historic.filter(h=>h.owner===pi);
  if(!owned.length)break;
  const hId=await chooseRequired(UI10.needFunds,owned.map(h=>({value:h.id,html:`<b>${h.year} ${esc(h.teams)}</b><small>${T.cost} ${h.cost} Points</small>`})),`<div class="debtBox"><div class="debtProgress"><span>${state.players[pi].points} Points</span><span>${UI10.payment} ${amount} Points</span></div></div>`);
  const h=state.historic.find(x=>x.id===hId);
  const where=await chooseRequired(UI10.sellHistoric,[
   {value:"bank",html:`<b>${UI10.sellBank}</b><small>+${h.cost} Points</small>`},
   {value:"player",html:`<b>${UI10.sellPlayer}</b><small>${UI10.agreedPrice}</small>`}
  ]);
  if(where==="bank"){
   h.owner=null;state.players[pi].points+=h.cost;addLog(state.players[pi].name+" sold "+h.year+" "+h.teams+" to Bank");
  }else{
   const sold=await sellHistoricToPlayer(pi,h);
   if(!sold)continue;
  }
 }
}
async function settleDebt(pi,amount,to){
 amount=Math.max(0,+amount||0);
 await liquidateForDebt(pi,amount);

 if(Number.isInteger(to))state.players[to].points+=paid;
 return{paid,shortfall:Math.max(0,amount-paid),due:amount};
}

  short=`<b>${h.year}</b><span>${esc(parts.a)}</span><span>vs</span><span>${esc(parts.b)}</span>`;
  const owner=h.owner==null?UI9.bank:state.players[h.owner].name;
  full=`<b>${h.year} ${esc(h.stage)}</b><span>${esc(parts.a)} vs ${esc(parts.b)}</span><small>${UI9.price} ${h.cost} &middot; Bonus ${h.bonus} &middot; ${T.endValue} ${h.end}</small><small>${UI9.ownerShort}: ${esc(owner)}</small>`;
 }else{
  short=boardSpecialIcon(pos)+`<b>${esc(name)}</b>`;
  full=boardSpecialIcon(pos)+`<b>${esc(name)}</b>`;
 }
 const classes=["boardCell",h?"historic":"",pos%8===0?"corner":"",pos===0?"goCell":"",currentPlayers?"currentCell":""].filter(Boolean).join(" ");
 return `<div class="${classes}" data-board-pos="${pos}" style="grid-row:${p.r};grid-column:${p.c};--cell-color:${color}" title="${esc(name)}"><div class="cellShort">${short}</div><div class="cellFull">${full}</div>${tokens}</div>`;
}
function boardCenterHTML(){
 const left=Math.max(0,state?state.wcNumbers.length-state.wcPlayed.length:7);
 return `<div class="boardCenter"><div class="centerGame"><div class="centerBrand"><strong>MONOPOLY</strong><span>FIFA WORLD CUP 2026</span></div><div class="centerDecks"><div class="centerDeck gc"><div><b>${UI10.gameChangerDeck}</b></div></div><div class="centerDeck wc"><div><b>${UI10.worldCupDeck}</b><small>${UI10.cardsLeft} ${left}</small></div></div></div><div class="centerRounds"><div class="roundRow"><div class="roundSide">${UI10.currentSideShort}</div>${[1,2,3].map(i=>`<div class="roundSlot"><b>ROUND ${i}</b></div>`).join("")}</div><div class="roundRow"><div class="roundSide">${UI10.opponentShort}</div>${[1,2,3].map(i=>`<div class="roundSlot"><b>ROUND ${i}</b></div>`).join("")}</div></div></div></div>`;
}
function boardPreviewHTML(mode){
 mode=mode||"detail";
 let cells=BOARD.map((x,i)=>boardCellHTML(i,mode)).join("");
 cells+=boardCenterHTML();
 return `<div class="boardPreviewWrap ${mode==="compact"?"compactWrap":"detailWrap"}"><div class="boardPreview ${mode==="compact"?"compactBoard":"detailBoard"}">${cells}</div></div>`;
}
function boardListItemHTML(pos){
 const h=matchAtBoardPos(pos),strip=h?COLORS[h.color]:"transparent";
 if(h){
  const owner=h.owner==null?UI9.bank:state.players[h.owner].name;
  return `<div class="choice boardChoice colored" style="--board-strip:${strip}"><span class="boardNumber">${pos}</span><b>${h.year} ${esc(h.stage)} - ${esc(h.teams)}</b><small>${UI9.price} ${h.cost} &middot; Bonus ${h.bonus} &middot; ${T.endValue} ${h.end} &middot; ${UI9.ownerShort}: ${esc(owner)}</small></div>`;
 }
 return `<div class="choice boardChoice"><span class="boardNumber">${pos}</span><b>${esc(BOARD[pos])}</b></div>`;
}
function advanceFrom(start,roll){
 let pos=Number.isInteger(start)?start:0,steps=0,stoppedAtGo=false;
 for(let i=0;i<roll;i++){
  pos=(pos+1)%BOARD.length;steps++;
  if(pos===0){stoppedAtGo=true;break}
 }
 return{pos,steps,stoppedAtGo};
}
function liveBoardPanelHTML(){
 if(!state||!state.liveBoardEnabled)return"";
 const pl=state.players[state.current],pos=Number.isInteger(pl.boardPos)?pl.boardPos:0;
 const locked=state.pendingLanding!=null;
 const landing=locked?`<div class="landingCard"><div class="landingLabel">${UI9.landed}</div><div class="landingName">${esc(BOARD[pos])}</div>${state.lastRoll?`<div class="landingMeta">${UI9.rolled} ${state.lastRoll.roll}${state.lastRoll.stoppedAtGo?` &middot; ${UI9.stoppedGo}`:""}</div>`:""}<button id="landingActionBtn" class="btn liveActionBtn">${UI9.doAction}: ${esc(actionNameFromBoardPos(pos))}</button></div>`:"";
 return `<section class="panel liveBoardPanel"><div class="liveBoardHeader"><div><div class="liveBoardTitle">${T.board}</div><div class="liveBoardDirection">${UI9.direction}</div></div><div class="livePosition"><span>${UI9.position}</span><b>${esc(BOARD[pos])}</b></div></div>${boardPreviewHTML("compact")}<div class="movementBox"><div class="movementTitle">${UI9.rollPrompt}</div><div class="moveDice">${[1,2,3,4,5,6].map(v=>`<button class="moveDie" data-roll="${v}" ${locked||pl.posStatus==="bench"?"disabled":""}>${v}</button>`).join("")}</div>${locked?`<div class="movementHint">${UI9.alreadyRolled}</div>`:pl.posStatus==="bench"?`<div class="movementHint">${UI9.benchLive}</div>`:""}</div>${landing}<div class="liveBoardBtns"><button class="btn secondary" id="expandLiveBoard">${UI9.expand}</button><button class="btn secondary" id="editBoardPos">${UI9.editPosition}</button></div></section>`;
}function bindLiveBoardControls(){
 if(!state||!state.liveBoardEnabled)return;
 $$(".moveDie").forEach(b=>b.onclick=()=>recordMovement(+b.dataset.roll));
 const ex=$("#expandLiveBoard");if(ex)ex.onclick=openBoardReference;
 const ed=$("#editBoardPos");if(ed)ed.onclick=manualBoardPosition;
 const act=$("#landingActionBtn");if(act)act.onclick=()=>runAction(actionFromBoardPos(state.players[state.current].boardPos));
}
function recordMovement(roll){
 if(!state||!state.liveBoardEnabled||state.pendingLanding!=null)return;
 const pi=state.current,pl=state.players[pi];
 if(pl.posStatus==="bench"){info(T.bench,UI9.benchLive);return}
 const before=JSON.stringify(state),start=Number.isInteger(pl.boardPos)?pl.boardPos:0,mv=advanceFrom(start,roll);
 pl.boardPos=mv.pos;state.pendingLanding=mv.pos;state.lastRoll={player:pi,roll:roll,start:start,end:mv.pos,steps:mv.steps,stoppedAtGo:mv.stoppedAtGo};
 addLog(pl.name+" "+UI9.rolled+" "+roll+" : "+BOARD[start]+" -> "+BOARD[mv.pos]);
 pushHistory(before);save();renderGame();
}
async function manualBoardPosition(){
 if(!state)return;
 const pi=await choose(UI9.choosePlayerPos,state.players.map((p,i)=>({value:i,html:`<b>${esc(p.name)}</b><small>${UI9.current}: ${esc(BOARD[Number.isInteger(p.boardPos)?p.boardPos:0])}</small>`})));if(pi==null)return;
 const pos=await choose(UI9.choosePos,BOARD.map((x,i)=>({value:i,html:`<b>${i}. ${esc(x)}</b>`})));if(pos==null)return;
 const before=JSON.stringify(state);state.players[pi].boardPos=+pos;
 if(pi===state.current){state.pendingLanding=+pos;state.lastRoll={player:pi,roll:"-",start:+pos,end:+pos,steps:0,manual:true}}
 pushHistory(before);save();renderGame();
}
function teamJetDestinationPositions(start){
 const positions=[];let pos=start;
 for(let k=0;k<BOARD.length;k++){
  const next=(pos+1)%BOARD.length;
  if(next!==0&&BOARD[next]==="Team Jet")break;
  positions.push(next);
  if(next===0)break;
  pos=next;
 }
 return positions;
}
function teamJetDestinationOption(pos){
 const h=matchAtBoardPos(pos),color=h?COLORS[h.color]:"transparent",label=BOARD[pos]||"";
 return `<button class="teamJetChoice ${h?"historic":""}" data-jet-pos="${pos}" style="--jet-strip:${color}"><span class="teamJetNumber">${pos}</span><span class="teamJetLabel">${esc(label)}</span></button>`;
}
function chooseTeamJetDestination(start){
 return new Promise(res=>{
  const positions=teamJetDestinationPositions(start);
  openOverlay(`<div class="modalBg"><div class="modal"><h2>${T.teamJet}</h2><div class="teamJetHelp"><b>${UI10.jetRule}</b><br>${UI10.jetGo}</div><div class="teamJetChoices"><button class="teamJetChoice teamJetStay" data-jet-pos="${start}"><span class="teamJetNumber">${start}</span><span class="teamJetLabel">${UI10.stayJet}</span></button>${positions.map(teamJetDestinationOption).join("")}</div></div></div>`);
  $$(".teamJetChoice[data-jet-pos]").forEach(b=>b.onclick=()=>{const v=+b.dataset.jetPos;closeOverlay();res(v)});
 })
}
async function doTeamJetTracking(){
 if(!state.liveBoardEnabled){
  await confirmOnly(T.teamJet,`<div class="notice">${UI10.jetRule}<br>${UI10.jetGo}</div>`,T.ok);
  return{endTurn:true};
 }
 const pi=state.current,pl=state.players[pi],start=Number.isInteger(pl.boardPos)?pl.boardPos:0;
 if(BOARD[start]!=="Team Jet"){await info(T.teamJet,T.jetHelp);return{cancelled:true}}
 const dest=await chooseTeamJetDestination(start);
 pl.boardPos=dest;state.pendingLanding=null;
 state.lastRoll={player:pi,roll:"JET",start:start,end:dest,steps:0,jet:true,jetConsumed:true};
 addLog(pl.name+" Team Jet: "+BOARD[start]+" -> "+BOARD[dest]);
 if(dest===0)return await doGO();
 return{endTurn:true};
}
function openBoardReference(){
 openOverlay(`<div class="modalBg"><div class="modal boardReferenceModal"><h2>${T.boardTitle}</h2><div class="boardDirectionBanner"><b>${UI9.direction}</b><span>&rarr; &darr; &larr; &uarr;</span></div>${boardPreviewHTML("detail")}<div class="boardList">${BOARD.map((x,i)=>boardListItemHTML(i)).join("")}</div><div class="modalBtns"><button id="boardEdit">${UI9.editPosition}</button><button class="primary" id="boardClose">${T.close}</button></div></div></div>`);
 $("#boardClose").onclick=closeOverlay;
 $("#boardEdit").onclick=()=>{closeOverlay();manualBoardPosition()};
}
function openMatchList(){
 const items=state.historic.slice().sort((a,b)=>a.boardPos-b.boardPos);
 openOverlay(`<div class="modalBg"><div class="historicModal"><div class="historicHero"><div class="historicHeroTop"><div><h2>${T.matches}</h2></div><div class="historicHeroMark">${actionIcon("historic")}</div></div></div><div class="historicBody"><div class="historicGrid">${historicGridHTML(items,false)}</div></div><div class="historicFooter"><button id="matchClose">${T.close}</button></div></div></div>`);$("#matchClose").onclick=closeOverlay;
}
function openManage(){
 openOverlay(`<div class="modalBg"><div class="modal"><h2>${T.manage}</h2><div class="choices">
 <button class="choice man" data-x="trade"><b>${UI10.tradeHistoric}</b></button>
 <button class="choice man" data-x="points"><b>${T.managePoints}</b></button>
 <button class="choice man" data-x="active"><b>${T.manageActive}</b></button>
 <button class="choice man" data-x="owner"><b>${T.manageOwner}</b></button>
 <button class="choice man" data-x="final"><b>${T.finalScore}</b></button>
 </div><div class="modalBtns"><button id="manageClose">${T.close}</button></div></div></div>`);
 $$(".man").forEach(b=>b.onclick=async()=>{const x=b.dataset.x;closeOverlay();if(x==="trade")await historicTrade();if(x==="points")await manualPoints();if(x==="active")await manualActive();if(x==="owner")await manualOwner();if(x==="final")await finishGame()});
 $("#manageClose").onclick=closeOverlay;
}
async function historicTrade(){
 const sellers=state.players.map((p,i)=>({p,i})).filter(x=>state.historic.some(h=>h.owner===x.i));
 if(!sellers.length){await info(UI10.tradeHistoric,UI10.noHistoric);return}
 const seller=await choose(UI10.seller,sellers.map(x=>({value:x.i,html:`<b>${esc(x.p.name)}</b>`})));if(seller==null)return;
 const owned=state.historic.filter(h=>h.owner===seller);
 const hid=await choose(UI10.sellHistoric,owned.map(h=>({value:h.id,html:`<b>${h.year} ${esc(h.teams)}</b><small>${T.cost} ${h.cost}</small>`})));if(hid==null)return;
 const h=state.historic.find(x=>x.id===hid),before=JSON.stringify(state);
 const sold=await sellHistoricToPlayer(seller,h);if(!sold)return;
 pushHistory(before);renderGame();save();
}
async function manualPoints(){
 const pi=await choose(T.choosePlayer,state.players.map((p,i)=>({value:i,html:`<b>${esc(p.name)}</b><small>${p.points} Points</small>`})));if(pi==null)return;
 const before=JSON.stringify(state);
 return new Promise(res=>{openOverlay(`<div class="modalBg"><div class="modal"><h2>${T.managePoints} - ${esc(state.players[pi].name)}</h2><label class="label">${T.pointChange}</label><input id="deltaPts" type="number" value="0"><div class="modalBtns"><button id="mpCancel">${T.cancel}</button><button class="primary" id="mpOk">${T.save}</button></div></div></div>`);$("#mpCancel").onclick=()=>{closeOverlay();res()};$("#mpOk").onclick=()=>{state.players[pi].points=Math.max(0,state.players[pi].points+(+$("#deltaPts").value||0));closeOverlay();pushHistory(before);renderGame();save();res()}})
}
async function manualActive(){
 const pi=await choose(T.choosePlayer,state.players.map((p,i)=>({value:i,html:`<b>${esc(p.name)}</b>`})));if(pi==null)return;
 const id=await chooseAnyPlayer(pi,T.choosePlayerCard);if(id==null)return;
 const before=JSON.stringify(state);state.players[pi].active[id]=!state.players[pi].active[id];pushHistory(before);renderGame();save();
}
async function manualOwner(){
 const hid=await choose(T.chooseMatch,state.historic.map(h=>({value:h.id,html:`<b>${h.year} ${esc(h.teams)}</b><small>${T.owner}: ${h.owner==null?T.bank:esc(state.players[h.owner].name)}</small>`})));if(hid==null)return;
 const opts=[{value:-1,html:`<b>${T.bank}</b>`}].concat(state.players.map((p,i)=>({value:i,html:`<b>${esc(p.name)}</b>`})));
 const owner=await choose(T.owner,opts);if(owner==null)return;
 const before=JSON.stringify(state);state.historic.find(h=>h.id===hid).owner=owner<0?null:owner;pushHistory(before);renderGame();save();
}
async function finishGame(){
 const rows=state.players.map((pl,i)=>{const hv=state.historic.filter(h=>h.owner===i).reduce((sum,h)=>sum+h.end*(completeSet(i,h.color)?2:1),0),wv=pl.wc.reduce((sum,x)=>sum+(x.value||0),0);return{i,name:pl.name,chips:pl.points,hv,wv,total:pl.points+hv+wv}}).sort((a,b)=>b.total-a.total);
 const topTotal=rows[0].total,tied=rows.filter(r=>r.total===topTotal).map(r=>r.i);
 let winner=tied[0];
 if(tied.length>1){
  await info(UI10.tieBreak,T.finalTie);
  const w=await multiWhiteTie(tied);if(w!=null)winner=w;
 }
 state.phase="ended";save();
 await new Promise(res=>{openOverlay(`<div class="modalBg"><div class="modal"><h2>${T.finalScore}</h2><table class="table"><tr><th>${T.choosePlayer}</th><th>Points</th><th>Historic</th><th>WC26</th><th>Total</th></tr>${rows.map(r=>`<tr><td><b>${esc(r.name)}</b></td><td>${r.chips}</td><td>${r.hv}</td><td>${r.wv}</td><td><b>${r.total}</b></td></tr>`).join("")}</table><div class="resultWinner" style="margin-top:12px"><div class="resultPerson">${UI10.finalWinner}: ${esc(state.players[winner].name)}</div></div><div class="modalBtns"><button class="primary" id="finalClose">${T.close}</button></div></div></div>`);$("#finalClose").onclick=()=>{closeOverlay();res()}})
}
$("#globalUndo").onclick=undoLast;
renderSetup();
</script>
</body>
</html>
