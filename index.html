<style>

place-items:center;min-width:29px;height:29px;margin-right:8px;border-radius:8px;border:1px solid #d5dad4;background:#f4f6f3;font-size:10px;font-weight:700}@media(max-width:700px){.boardReferenceModal{max-height:94vh}.boardPreview{min-width:520px}.boardCell{font-size:7.5px}}

function restorePageScroll(y){
 const restore=()=>{
  const doc=document.documentElement,body=document.body;
  const full=Math.max(doc?doc.scrollHeight:0,body?body.scrollHeight:0);

function draftPi(){
 const n=state.players.length,round=Math.floor(state.draftIndex/n),inside=state.draftIndex%n;
 const start=Number.isInteger(state.draftStart)?state.draftStart:0;
 const order=Array.from({length:n},(_,k)=>(start+k)%n);
 return round%2===0?order[inside]:order[n-1-inside];
}

async function endTurn(){

 state.pendingLanding=null;state.lastRoll=null;

}
async function runAction(type){
 if(actionLocked||!state||state.phase!=="play")return;
 actionLocked=true;
 const before=JSON.stringify(state);
 try{
  let result={cancelled:false,endTurn:true};
  if(type==="historic")result=await doHistoric();
  else if(type==="transfer")result=await doTransfer();
  else if(type==="gamechanger")result=await doGameChanger();
  else if(type==="jet")result=await doTeamJetTracking();
  else if(type==="bench"){
   const pl=state.players[state.current];pl.posStatus="bench";pl.benchReason="normal";pl.benchAttempts=0;
   if(state.liveBoardEnabled)pl.boardPos=8;addLog(pl.name+" - "+T.goBench);await info(T.goBench,T.goBenchSub)
  }
  else if(type==="visiting")await info(T.visiting,T.nothing);
  else if(type==="parking")await info(T.parking,T.nothing);
  else if(type==="other"){}
  else if(type==="go")result=await doGO();
  if(result&&result.cancelled){state=JSON.parse(before);closeOverlay();renderGame();save();return}
  pushHistory(before);
  if(state.phase==="play"&&(!result||result.endTurn!==false))await endTurn();else{renderGame();save()}
 }catch(e){
  console.error(e);state=JSON.parse(before);closeOverlay();renderGame();save();await info(T.error,T.restored)
 }finally{actionLocked=false}
}

   {value:"player",html:`<b>${UI10.sellPlayer}</b><small>${UI10.agreedPrice}</small>`}

   h.owner=null;state.players[pi].points+=h.cost;addLog(state.players[pi].name+" sold "+h.year+" "+h.teams+" to Bank");
  }else{

  }
 }

}
async function settleDebt(pi,amount,to){
 amount=Math.max(0,+amount||0);
 const ok=await liquidateForDebt(pi,amount);if(!ok)return{paid:0,shortfall:amount,due:amount,cancelled:true};

 state.players[pi].points-=paid;
 if(Number.isInteger(to))state.players[to].points+=paid;
 return{paid,shortfall:Math.max(0,amount-paid),due:amount};
}

 await new Promise(res=>{openOverlay(`<div class="modalBg"><div class="modal finalCeremonyModal"><div class="finalCeremonyHero"><div class="finalTrophyWrap">${finalTrophySVG()}</div><div class="finalComplete">GAME COMPLETE</div><h2>FINAL RESULTS</h2><div class="finalCeremonySub">\u0e2a\u0e23\u0e38\u0e1b\u0e1c\u0e25\u0e01\u0e32\u0e23\u0e41\u0e02\u0e48\u0e07\u0e02\u0e31\u0e19 \u2022 \u0e1b\u0e23\u0e30\u0e01\u0e32\u0e28\u0e1c\u0e39\u0e49\u0e0a\u0e19\u0e30</div><div class="finalChampion" style="--winner-color:${winnerPl.color}"><div class="finalChampionAvatar">${avatarSVG(winnerPl.avatar)}</div><div class="finalChampionText"><small>CHAMPION</small><b>${esc(winnerPl.name)}</b></div><div class="finalChampionScore"><b>${winnerRow.total}</b><small>TOTAL POINTS</small></div></div></div><div class="finalScoreBody"><div class="finalScoreTitle"><b>FINAL SCOREBOARD</b><span>Points + Historic + WC26</span></div><div class="finalTableWrap"><table class="table finalScoreTable"><tr><th>${T.choosePlayer}</th><th>Points</th><th>Historic</th><th>WC26</th><th>Total</th></tr>${rows.map(r=>`<tr class="${r.i===winner?"finalWinnerRow":""}"><td><b>${esc(r.name)}</b></td><td>${r.chips}</td><td>${r.hv}</td><td>${r.wv}</td><td><b>${r.total}</b></td></tr>`).join("")}</table></div></div><div class="finalCeremonyFooter"><button class="primary" id="finalClose">${T.close}</button></div></div></div>`);$("#finalClose").onclick=()=>{closeOverlay();res()}})
}
$("#globalUndo").onclick=globalBack;$("#globalRedo").onclick=redoLast;

renderSetup();
