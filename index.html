<style>

place-items:center;min-width:29px;height:29px;margin-right:8px;border-radius:8px;border:1px solid #d5dad4;background:#f4f6f3;font-size:10px;font-weight:700}@media(max-width:700px){.boardReferenceModal{max-height:94vh}.boardPreview{min-width:520px}.boardCell{font-size:7.5px}}

}

.boardToken{display:block!important;width:10px!important;height:10px!important;border-radius:50%!important;background:var(--token)!important;border:1.5px solid #fff!important;box-shadow:0 0 0 1px rgba(0,0,0,.40),0 2px 4px rgba(0,0,0,.24)!important;opacity:1!important}
.boardToken.current{transform:scale(1.18)!important;box-shadow:0 0 0 2px #111,0 2px 5px rgba(0,0,0,.28)!important;z-index:2}
.boardToken span{display:none!important}
.tokenCount1{grid-template-columns:13px!important}.tokenCount1 .boardToken{width:13px!important;height:13px!important}
.tokenCount2{grid-template-columns:repeat(2,10px)!important}.tokenCount2 .boardToken{width:10px!important;height:10px!important}
.tokenCount3,.tokenCount4{grid-template-columns:repeat(2,9px)!important;grid-template-rows:repeat(2,9px)!important}.tokenCount3 .boardToken,.tokenCount4 .boardToken{width:9px!important;height:9px!important}
.tokenCount3 .boardToken:nth-child(3){grid-column:auto!important;justify-self:auto!important}
.boardCell.sideTop .boardTokens{left:auto!important;right:1px!important;top:1px!important;bottom:auto!important}
.boardCell.sideRight .boardTokens{left:auto!important;right:1px!important;top:auto!important;bottom:1px!important}
.boardCell.sideBottom .boardTokens{left:auto!important;right:1px!important;top:auto!important;bottom:1px!important}
.boardCell.sideLeft .boardTokens{left:1px!important;right:auto!important;top:auto!important;bottom:1px!important}
.detailBoard .boardToken{width:12px!important;height:12px!important}.detailBoard .tokenCount1 .boardToken{width:15px!important;height:15px!important}

/* Team Jet destination Historic cards show owner as well as color. */
.teamJetMeta{display:block!important;margin-top:7px!important;font-size:11px!important;line-height:1.35!important;color:#4c554e!important}
.teamJetMeta b{font-size:11.5px!important;color:#111}

/* WC26 black card number is explicitly a card number, not a score. */
.wcCardNo.wcCardNumber{width:auto!important;min-width:58px!important;padding:0 9px!important;font-size:13px!important;white-space:nowrap}

/* Back is at the far left and Forward at the far right of the bottom edge. */
.historyControls{left:0!important;right:0!important;bottom:calc(env(safe-area-inset-bottom) + 8px)!important;transform:none!important;width:100%!important;min-height:46px!important;padding:0 max(10px,env(safe-area-inset-right)) 0 max(10px,env(safe-area-inset-left))!important;border:0!important;border-radius:0!important;background:transparent!important;box-shadow:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;display:flex!important;align-items:center!important;justify-content:space-between!important;pointer-events:none!important}
.historyControls.hidden{display:none!important}.historyDivider{display:none!important}
.historyBtn.globalUndo,.historyBtn.globalRedo{pointer-events:auto!important;position:static!important;min-width:112px!important;min-height:42px!important;padding:9px 12px!important;border:1px solid #c9cfca!important;border-radius:14px!important;background:rgba(255,255,255,.97)!important;box-shadow:0 8px 24px rgba(31,39,33,.14)!important;backdrop-filter:blur(14px)!important;-webkit-backdrop-filter:blur(14px)!important;font-size:11.5px!important}
@media(max-width:380px){.historyBtn.globalUndo,.historyBtn.globalRedo{min-width:100px!important;padding:8px 10px!important}.historyLabel{font-size:10.5px!important}}


/* V14.8.2 — requested visual cleanup */

/* Compact board: ownership must remain readable inside tiny mobile cells. */
.compactOwner{
  display:flex!important;
  flex-direction:column!important;
  align-items:center!important;
  justify-content:center!important;
  gap:0!important;
  width:100%!important;
  max-width:100%!important;
  margin-top:1px!important;
  line-height:1!important;
  white-space:normal!important;
  overflow:visible!important;
  text-overflow:clip!important;
  color:#1f241f!important;
}
.compactOwnerLabel{
  display:block!important;
  max-width:100%!important;
  font-size:4.1px!important;
  line-height:1!important;
  font-weight:700!important;
  color:#687068!important;
  white-space:nowrap!important;
}
.compactOwner b{
  display:block!important;
  max-width:100%!important;
  margin-top:1px!important;
  font-size:4.9px!important;
  line-height:1.02!important;
  font-weight:900!important;
  color:#171b17!important;
  white-space:normal!important;
  overflow-wrap:anywhere!important;
  word-break:normal!important;
}
.boardReferenceModal .detailBoard .compactOwnerLabel{font-size:5px!important}
.boardReferenceModal .detailBoard .compactOwner b{font-size:5.9px!important}

/* Keep the upper-left identity minimal: gold M + MONOPOLY only. */
.appMiniText b{font-size:13px!important;letter-spacing:.05em!important}

/* FIFA World Cup matchup: the side currently choosing gets a stronger,
   darker green treatment while keeping the premium neutral palette. */
.wcPickGuide{
  border-color:#cfd8cf!important;
  background:linear-gradient(180deg,#f6f8f5 0%,#f1f5f1 100%)!important;
}
.wcPickSide.you{
  border:1.5px solid #8fa791!important;
  background:linear-gradient(180deg,#e9f1e8 0%,#dfeade 100%)!important;
  box-shadow:0 5px 15px rgba(47,72,51,.10),inset 0 0 0 1px rgba(255,255,255,.55)!important;
}
.wcPickSide.you small{
  color:#405743!important;
  font-weight:800!important;
}
.wcPickSide.you b{
  color:#173b21!important;
  font-weight:900!important;
}
.wcPickSide.you span{
  color:#3c5541!important;
  font-weight:700!important;
}
.wcStatChip.focus{
  background:#cfdfcd!important;
  color:#173b21!important;
  outline:1.5px solid #86a089!important;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.45)!important;
  font-weight:900!important;
}

function decodeLegacyUnicodeText(value){
 if(typeof value!=="string")return value;
 let out=value;
 for(let pass=0;pass<3;pass++){
  const next=out.replace(/\\u([0-9a-fA-F]{4})/g,(_,hex)=>String.fromCharCode(parseInt(hex,16)));
  if(next===out)break;
  out=next;
 }
 return out;
}
function normalizeLegacyLogText(text){
 if(typeof text!=="string")return text;
 let s=decodeLegacyUnicodeText(text);
 s=s.replace(/ GO \+4/g," ถึง GO · รับ 4 แต้ม");
 s=s.replace(/ bought /g," ซื้อ ").replace(/ sold /g," ขาย ").replace(/ defended /g," ป้องกัน ").replace(/ took /g," ยึด ").replace(/ used /g," ใช้ ").replace(/ won /g," ชนะ ").replace(/ traded /g," แลก ");
 s=s.replace(/ stayed on Team Jet/g," เลือกอยู่ที่ Team Jet เดิม");
 return s;
}
function repairLegacyText(value){
 if(typeof value==="string")return decodeLegacyUnicodeText(value);
 if(Array.isArray(value))return value.map(repairLegacyText);
 if(value&&typeof value==="object"){
  Object.keys(value).forEach(key=>{value[key]=repairLegacyText(value[key])});
 }
 return value;
}
function repairSnapshot(snapshot){
 if(typeof snapshot!=="string")return snapshot;
 try{return JSON.stringify(repairLegacyText(JSON.parse(snapshot)))}catch(e){return decodeLegacyUnicodeText(snapshot)}
}

function restorePageScroll(y){
 const restore=()=>{
  const doc=document.documentElement,body=document.body;
  const full=Math.max(doc?doc.scrollHeight:0,body?body.scrollHeight:0);
  const maxY=Math.max(0,full-window.innerHeight);
  const target=Math.min(Math.max(0,Number(y)||0),maxY);
  try{window.scrollTo(0,target)}catch(e){}
  if(doc)doc.scrollTop=target;
  if(body)body.scrollTop=target;
 };
 requestAnimationFrame(()=>{restore();requestAnimationFrame(restore)});
}

 if(state.turnResolved){await info("เทิร์นนี้เสร็จแล้ว","กติกาของเทิร์นนี้เสร็จเรียบร้อยแล้ว กรุณากด จบเทิร์น หรือใช้ → ไปข้างหน้า หากเพิ่งย้อนกลับมา");return;}
 actionLocked=true;
 const before=JSON.stringify(state);
 try{
  let result={cancelled:false,endTurn:true};
  if(type==="historic")result=await doHistoric();
  else if(type==="transfer")result=await doTransfer();
  else if(type==="gamechanger")result=await doGameChanger();
  else if(type==="jet")result=await doTeamJetTracking();
  else if(type==="bench"){
   const pl=state.players[state.current];pl.posStatus="bench";pl.benchReason="normal";pl.benchAttempts=0;
   if(state.liveBoardEnabled)pl.boardPos=8;addLog(pl.name+" - "+T.goBench);await info(T.goBench,T.goBenchSub)
  }
  else if(type==="visiting")await info(T.visiting,T.nothing);
  else if(type==="parking")await info(T.parking,T.nothing);
  else if(type==="other"){}
  else if(type==="go")result=await doGO();
  if(result&&result.cancelled){state=JSON.parse(before);closeOverlay();renderGame();save();return}
  const shouldEnd=state.phase==="play"&&(!result||result.endTurn!==false);
  if(shouldEnd){state.pendingLanding=null;state.turnResolved=true;}
  pushHistory(before);
  if(shouldEnd)await endTurn();else{renderGame();save()}
 }catch(e){
  console.error(e);state=JSON.parse(before);closeOverlay();renderGame();save();await info(T.error,T.restored)
 }finally{actionLocked=false}
}

async function liquidateForDebt(pi,amount){
 while(state.players[pi].points<amount){
  const owned=state.historic.filter(h=>h.owner===pi);
  if(!owned.length)break;
  const hId=await chooseRequired(UI10.needFunds,owned.map(h=>({value:h.id,html:`<b>${h.year} ${esc(h.teams)}</b><small>${T.cost} ${h.cost} แต้ม</small>`})),`<div class="debtBox"><div class="debtProgress"><span>${state.players[pi].points} แต้ม</span><span>${UI10.payment} ${amount} แต้ม</span></div></div>`);
  if(hId==null)return false;
  const h=state.historic.find(x=>x.id===hId);
  const where=await chooseRequired(UI10.sellHistoric,[
   {value:"bank",html:`<b>${UI10.sellBank}</b><small>+${h.cost} แต้ม</small>`},
   {value:"player",html:`<b>${UI10.sellPlayer}</b><small>${UI10.agreedPrice}</small>`}
  ]);
  if(where==null)return false;
  if(where==="bank"){
   h.owner=null;state.players[pi].points+=h.cost;addLog(state.players[pi].name+" ขาย Historic Match "+h.year+" "+h.teams+" ให้ธนาคาร");
  }else{
   const sold=await sellHistoricToPlayer(pi,h);
   if(!sold)continue;
  }
 }
 return true;
}
async function settleDebt(pi,amount,to){
 amount=Math.max(0,+amount||0);
 const ok=await liquidateForDebt(pi,amount);if(!ok)return{paid:0,shortfall:amount,due:amount,cancelled:true};
 const paid=Math.min(amount,state.players[pi].points);
 state.players[pi].points-=paid;
 if(Number.isInteger(to))state.players[to].points+=paid;
 return{paid,shortfall:Math.max(0,amount-paid),due:amount};
}
async function payBank(pi,amount){return settleDebt(pi,amount,null)}

 const A=byId(aid),D=byId(did);let ownerWins=false,explain="",ownerTotal="",visitorTotal="";
 if(dice.g==="ball"&&dice.r!=="glove"){

 }else if(dice.r==="glove"){

 }else{

  ownerWins=at>de;explain=esc(A.name)+": "+A.attack+"+"+dice.g+"="+at+" เทียบกับ "+esc(D.name)+": "+D.defense+"+"+dice.r+"="+de;
 }
 usePlayer(owner,aid);usePlayer(vis,did);
 const rows=[{name:state.players[owner].name,total:ownerTotal},{name:state.players[vis].name,total:visitorTotal}];
 if(ownerWins){
  const b=h.bonus*(completeSet(owner,h.color)?2:1),settled=await transferPoints(vis,owner,b);if(settled.cancelled)return false;
  const ownerLines=["ได้รับ "+settled.paid+" แต้ม"];
  const visitorLines=["จ่าย "+settled.paid+" แต้ม"];

async function doTransfer(){

 state.players.forEach((pl,i)=>{if(i!==cur)pl.team.forEach(id=>opts.push({kind:"player",owner:i,id}))});
 state.reserve.forEach(id=>opts.push({kind:"reserve",owner:null,id}));

}

async function multiWhiteTie(indices,context,title,uiOptions){
 const label=context||"ตัดสินเสมอ",promptTitle=title||T.whiteTie,results=[],total=indices.length;
 for(let step=0;step<indices.length;step++){
  const i=indices[step];
  const meta={step:step+1,total:total,context:label,...(uiOptions||{})};
  const r=await askWhiteDie(promptTitle,i,meta);
  if(r==null)return null;
  results.push({i,r});
 }
 const max=Math.max(...results.map(x=>x.r)),top=results.filter(x=>x.r===max).map(x=>x.i);
 if(top.length>1){
  await info("ผลลูกเต๋าเสมอกัน","ผู้ที่ได้ "+max+" เท่ากันต้องทอยใหม่");
  return multiWhiteTie(top,label,title,uiOptions);
 }
 return top[0];
}
